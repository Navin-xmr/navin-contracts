# cargo-deny policy. Keep this aligned with Cargo.lock; do not add unused
# license allowances or advisory ignores.

[advisories]
# Transitive soroban-sdk crates currently include unmaintained `derivative`
# and `paste`. Fail only if a workspace crate itself is unmaintained.
unmaintained = "workspace"
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates set publish = false.
ignore = true

[bans]
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
